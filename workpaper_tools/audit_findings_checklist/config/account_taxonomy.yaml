  - name: 투자부동산
    strong_keywords: [투자부동산]
  - name: 무형자산및연구개발비
    keywords: [무형자산, 무형고정자산, 영업권, 개발비, 경상연구개발비, 연구개발비, 소프트웨어, 특허권, 상표권, 산업재산권, 전용실시권, 회원권, 고객관계, 무형자산상각비]
  - name: 리스
