# 표준 계정 분류 + 동의어·키워드 사전
# 회사 계정명과 지적사항의 관련 계정을 모두 이 분류로 정규화한 뒤 서로 연결한다.
# 직접 수정해도 된다. 고친 뒤 `python main.py map ...`을 다시 실행하면 반영된다.
#
# 매칭 규칙 (공백 제거 후 계정명에 키워드가 들어 있는지 본다)
#   1) overrides에 계정명이 있으면 그 분류로 확정
#   2) strong_keywords가 계정명 어디에든 들어 있으면 우선 (예: "이자비용(리스)" → 리스)
#   3) 괄호·하이픈·밑줄·슬래시 앞부분을 계정의 본래 이름으로 보고, 그 안에서 가장 뒤에서 끝나는
#      키워드를 고른다. 같은 위치에서 끝나면 더 긴 것이 이긴다.
#      (예: "상품매출원가" → 매출원가, "반제품 매출" → 매출, "외상매출금" → 매출채권)
# 신뢰도: 본래 이름과 완전일치 1.0 / strong 0.9 / 본래 이름의 끝말 0.85 / 본래 이름 중간 0.7
#         / 괄호 등 부가 부분에서만 발견 0.6
# 신뢰도가 config.yaml의 mapping.llm_threshold 미만이거나 키워드가 없으면 Claude가 의미로 판단한다.

categories:
  # ── 자산 ─────────────────────────────────────────────
  - name: 현금및예금
    keywords: [현금, 보통예금, 당좌예금, 외화예금, 제예금, 기타제예금, 전도금, 예금, 단기금융상품, 장기금융상품, 정기예적금, 정기예금, 정기적금, MMF]
  - name: 매출채권
    keywords: [매출채권, 외상매출금, 외화외상매출금, 받을어음, 부도어음, 공사미수금, 분양미수금, 계약자산, 대손충당금, 대손상각비, 카드미수금]
  - name: 대여금및기타채권
    keywords: [대여금, 미수금, 미수수익, 가지급금]
  - name: 선급금및선급비용
    keywords: [선급금, 선급비용, 장기선급비용]
  - name: 보증금
    keywords: [임차보증금, 기타보증금, 보증금]
  - name: 재고자산
    keywords: [재고자산, 재고, 상품, 제품, 반제품, 재공품, 원재료, 부재료, 저장품, 미착품, 미성공사, 평가충당금, 반품자산, 용지]
  - name: 유가증권및금융자산
    keywords: [매도가능증권, 만기보유증권, 단기매매증권, 단기투자자산, 장기투자증권, 유가증권, 지분증권, 채무증권, 수익증권, 출자금,
               당기손익-공정가치, 기타포괄손익-공정가치, 상각후원가, 금융자산, 금융상품]
  - name: 종속·관계기업투자
    keywords: [종속기업투자, 관계기업투자, 공동기업투자, 지분법적용투자주식, 지분법]
  - name: 유형자산
