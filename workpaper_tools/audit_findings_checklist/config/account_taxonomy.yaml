  # ── 손익 ─────────────────────────────────────────────
  - name: 매출
    keywords: [매출, 매출액, 상품매출, 제품매출, 용역매출, 임대매출, 수수료매출, 수익인식, 공사수익, 분양수익, 용역수익, 임대료수입, 수수료수익, 영업수익]
  - name: 매출원가및제조원가
