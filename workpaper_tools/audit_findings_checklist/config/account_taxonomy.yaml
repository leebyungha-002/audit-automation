               지급수수료, 광고선전비, 판매촉진비, 접대비, 수선비, 수도광열비, 전력비, 차량유지비, 교육훈련비, 회의비, 견본비,
               포장비, 건물관리비, 실험비, 기부금, 경비, 수수료]
  - name: 외화환산및외환손익
    keywords: [외화환산, 외환차익, 외환차손]
  - name: 금융수익
    keywords: [이자수익, 배당금수익]
  - name: 기타손익
    keywords: [잡이익, 잡손실, 전기오류수정]

  # ── 계정이 아닌 주제 (주로 지적사항 쪽에서 쓰인다) ─────────
  - name: 특수관계자거래
    keywords: [특수관계자]
  - name: 연결및사업결합
    keywords: [연결, 사업결합, 인수가격배분, 내부거래]
  - name: 현금흐름표
    keywords: [현금흐름]

# 계정명이 정확히 일치하면 무조건 이 분류로 본다 (회사별 예외 처리용)
overrides: {}
#  예) 본지점(자산비용): 대여금및기타채권

# 지적사항의 관련 계정 중 분류에 쓰지 않는 말 (거의 모든 사례에 붙어 변별력이 없음)
finding_term_ignore: [자기자본, 당기순이익, 당기손익, 영업이익, 영업손실, 자산, 부채, 수익, 비용, 순자산]
