  # ── 자본 ─────────────────────────────────────────────
  - name: 자본
    keywords: [자본금, 주식발행초과금, 자본잉여금, 이익잉여금, 자기주식, 합병차익, 기타포괄손익누계액, 비지배지분]
  - name: 주식기준보상
